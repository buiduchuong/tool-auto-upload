name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build deploy package
        run: |
          set -euo pipefail
          rm -f deploy-package.zip
          zip -r deploy-package.zip . \
            -x ".git/*" \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x "accounts/*" \
            -x "chrome-profile*/*" \
            -x "videos/*" \
            -x "TikTok_Channel/*" \
            -x "uploaded_*/*" \
            -x "deleted_videos/*" \
            -x "*_upload_temp/*" \
            -x "instagram_debug/*" \
            -x "vps_light_package/*" \
            -x "vps_light_package.zip"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_OS: ${{ secrets.VPS_OS }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_SSH_KEY}" ] || [ -z "${VPS_DEPLOY_PATH}" ]; then
            echo "Missing required secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH"
            exit 1
          fi

          SSH_PORT="${VPS_PORT:-22}"
          TARGET_OS="$(printf '%s' "${VPS_OS:-windows}" | tr '[:upper:]' '[:lower:]')"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          if [ "${TARGET_OS}" = "linux" ]; then
            scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" deploy-package.zip "${VPS_USER}@${VPS_HOST}:/tmp/tool-auto-upload.zip"
            cat > deploy-vps.sh <<'EOS'
          set -euo pipefail
          mkdir -p "${DEPLOY_PATH}"
          unzip -oq /tmp/tool-auto-upload.zip -d "${DEPLOY_PATH}"
          echo "Deploy complete: ${DEPLOY_PATH}"
          EOS
            scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" deploy-vps.sh "${VPS_USER}@${VPS_HOST}:/tmp/deploy-tool-auto-upload.sh"
            ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${VPS_USER}@${VPS_HOST}" \
              "DEPLOY_PATH='${VPS_DEPLOY_PATH}' bash /tmp/deploy-tool-auto-upload.sh"
          else
            scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" deploy-package.zip "${VPS_USER}@${VPS_HOST}:C:/Windows/Temp/tool-auto-upload.zip"
            cat > deploy-vps.ps1 <<EOS
          \$ErrorActionPreference = "Stop"
          \$DeployPath = "${VPS_DEPLOY_PATH}"
          \$PackagePath = "C:/Windows/Temp/tool-auto-upload.zip"

          New-Item -ItemType Directory -Path \$DeployPath -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          \$Archive = [System.IO.Compression.ZipFile]::OpenRead(\$PackagePath)
          try {
              foreach (\$Entry in \$Archive.Entries) {
                  if ([string]::IsNullOrEmpty(\$Entry.Name)) {
                      continue
                  }
                  \$TargetPath = Join-Path \$DeployPath \$Entry.FullName
                  \$TargetDir = Split-Path -Parent \$TargetPath
                  if (-not (Test-Path -LiteralPath \$TargetDir)) {
                      New-Item -ItemType Directory -Path \$TargetDir -Force | Out-Null
                  }
                  [System.IO.Compression.ZipFileExtensions]::ExtractToFile(\$Entry, \$TargetPath, \$true)
              }
          }
          finally {
              \$Archive.Dispose()
          }
          Write-Output "Deploy complete: \$DeployPath"
          EOS
            scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" deploy-vps.ps1 "${VPS_USER}@${VPS_HOST}:C:/Windows/Temp/deploy-tool-auto-upload.ps1"
            ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${VPS_USER}@${VPS_HOST}" \
              "powershell -NoProfile -ExecutionPolicy Bypass -File C:/Windows/Temp/deploy-tool-auto-upload.ps1"
          fi
